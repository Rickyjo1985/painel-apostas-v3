<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Apostas Dinâmico</title>
    <!-- Ligação ao ficheiro de estilos separado -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 🔒 ECRÃ DE LOGIN -->
    <div id="login-box" class="box">
        <h2>🔒 Acesso Restrito</h2>
        <p>Introduza a palavra-passe do seu painel técnico.</p>
        <input type="password" id="password" placeholder="Palavra-passe">
        <button onclick="verificarSenha()">Entrar no Painel</button>
        <p id="error-msg" class="error"></p>
    </div>

    <!-- 📊 PAINEL DINÂMICO PRIVADO -->
    <div id="private-dashboard" class="dashboard">
        <div style="border-bottom: 2px solid var(--light); padding-bottom: 15px; margin-bottom: 20px;">
            <button onclick="sair()" class="btn-logout">Sair Seguro</button>
            <h2 style="margin: 0; color: var(--dark);">📊 Gestor de Apostas</h2>
        </div>

        <div class="stats-container">
            <div class="stat-card" style="border-left-color: #a0aec0;">
                <h4>Total Investido</h4>
                <p id="stat-investido">0,00 €</p>
            </div>
            <div class="stat-card" style="border-left-color: var(--success);">
                <h4>Lucro / Prejuízo</h4>
                <p id="stat-lucro">0,00 €</p>
            </div>
            <div class="stat-card" style="border-left-color: #f59e0b;">
                <h4>Operações Ativas</h4>
                <p id="stat-pendentes">0 Pendentes</p>
            </div>
        </div>

        <div class="layout-grid">
            <div class="form-section">
                <h3 style="margin-top: 0; color: var(--dark);">📝 Registar Operação</h3>
                <form id="bet-form" onsubmit="adicionarAposta(event)">
                    <label>Evento / Mercado</label>
                    <input type="text" id="form-evento" placeholder="Ex: Benfica vs Porto" required>

                    <label>Investimento (€)</label>
                    <input type="number" id="form-valor" step="0.01" placeholder="Ex: 20.00" required>

                    <label>Odd (Cotação)</label>
                    <input type="number" id="form-odd" step="0.01" placeholder="Ex: 1.85" required>

                    <label>Estado Inicial</label>
                    <select id="form-estado">
                        <option value="pendente">Pendente</option>
                        <option value="ganha">Ganha</option>
                        <option value="perdida">Perdida</option>
                    </select>

                    <button type="submit">Adicionar</button>
                </form>
            </div>

            <div>
                <h3 style="margin-top: 0; color: var(--dark);">📋 Histórico</h3>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Evento</th>
                                <th>Valor</th>
                                <th>Odd</th>
                                <th>Retorno</th>
                                <th>Estado</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const PALAVRA_PASSE_CORRETA = "SenhaSegura123";
        let apostas = JSON.parse(localStorage.getItem('minhas_apostas')) || [];

        function verificarSenha() {
            const input = document.getElementById("password").value;
            const erro = document.getElementById("error-msg");
            
            if (input === PALAVRA_PASSE_CORRETA) {
                document.getElementById("login-box").style.display = "none";
                document.getElementById("private-dashboard").style.display = "block";
                document.body.style.alignItems = "flex-start";
                atualizarPainel();
            } else {
                erro.innerText = "Palavra-passe incorreta.";
            }
        }

        function adicionarAposta(event) {
            event.preventDefault();
            const novaAposta = {
                id: Date.now(),
                evento: document.getElementById("form-evento").value,
                valor: parseFloat(document.getElementById("form-valor").value),
                odd: parseFloat(document.getElementById("form-odd").value),
                estado: document.getElementById("form-estado").value
            };
            apostas.push(novaAposta);
            localStorage.setItem('minhas_apostas', JSON.stringify(apostas));
            document.getElementById("bet-form").reset();
            atualizarPainel();
        }

        function eliminarAposta(id) {
            apostas = apostas.filter(a => a.id !== id);
            localStorage.setItem('minhas_apostas', JSON.stringify(apostas));
            atualizarPainel();
        }

        function atualizarPainel() {
            const tbody = document.getElementById("table-body");
            tbody.innerHTML = "";
            let totalInvestido = 0, lucroLiquido = 0, pendentes = 0;

            apostas.forEach(a => {
                totalInvestido += a.valor;
                let retornoBruto = a.valor * a.odd;
                
                if (a.estado === 'ganha') lucroLiquido += (retornoBruto - a.valor);
                else if (a.estado === 'perdida') lucroLiquido -= a.valor;
                else pendentes++;

                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td><strong>${a.evento}</strong></td>
                    <td>${a.valor.toFixed(2)} €</td>
                    <td>${a.odd.toFixed(2)}</td>
                    <td>${retornoBruto.toFixed(2)} €</td>
                    <td><span class="badge ${a.estado}">${a.estado}</span></td>
                    <td><button class="btn-delete" onclick="eliminarAposta(${a.id})">×</button></td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById("stat-investido").innerText = `${totalInvestido.toFixed(2)} €`;
            const cardLucro = document.getElementById("stat-lucro");
            cardLucro.innerText = `${lucroLiquido >= 0 ? '+' : ''}${lucroLiquido.toFixed(2)} €`;
            cardLucro.style.color = lucroLiquido >= 0 ? "var(--success)" : "var(--danger)";
            document.getElementById("stat-pendentes").innerText = `${pendentes} Ativa(s)`;
        }

        function sair() {
            document.getElementById("password").value = "";
            document.getElementById("login-box").style.display = "block";
            document.getElementById("private-dashboard").style.display = "none";
            document.body.style.alignItems = "center";
        }
    </script>
</body>
</html>

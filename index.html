<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Avançado Multibancas</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .multi-game-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
        .multi-game-row input { margin: 0; }
        .btn-sub { background-color: #666; padding: 6px; font-size: 12px; width: auto; margin: 5px 0; }
    </style>
</head>
<body>

    <!-- 🔒 ECRÃ DE LOGIN -->
    <div id="login-box" class="box">
        <h2>🔒 Acesso Restrito</h2>
        <p>Introduza a palavra-passe do seu painel técnico.</p>
        <input type="password" id="password" placeholder="Palavra-passe">
        <button onclick="verificarSenha()">Entrar no Painel</button>
        <p id="error-msg" class="error"></p>
    </div>

    <!-- 📊 PAINEL PRINCIPAL PRIVADO -->
    <div id="private-dashboard" class="dashboard">
        <div style="float: right; margin-top: 5px;">
            <button onclick="sair()" class="btn-logout">Sair Seguro</button>
        </div>
        
        <div class="main-nav">
            <button class="nav-link active" id="tab-gestor" onclick="mudarSeparador('gestor')">📈 Gestor de Apostas</button>
            <button class="nav-link" id="tab-jogos" onclick="mudarSeparador('jogos')">📅 Jogos da Semana</button>
        </div>

        <!-- SEPARADOR 1: GESTOR DE APOSTAS -->
        <div id="view-gestor">
            <div class="house-filters">
                <button class="btn-filter active" id="filter-todas" onclick="filtrarPorCasa('todas')">Todas as Bancas</button>
                <button class="btn-filter" id="filter-betclic" onclick="filtrarPorCasa('Betclic')">Betclic</button>
                <button class="btn-filter" id="filter-betano" onclick="filtrarPorCasa('Betano')">Betano</button>
                <button class="btn-filter" id="filter-placard" onclick="filtrarPorCasa('Placard')">Placard</button>
            </div>

            <div class="chart-container">
                <h4 style="margin: 0; color: #666; font-size: 11px; text-transform: uppercase;">Progresso da Banca Selecionada (Meta: +500€)</h4>
                <div class="progress-bar-bg">
                    <div id="chart-fill" class="progress-bar-fill"></div>
                    <div id="chart-text" class="progress-text">0%</div>
                </div>
            </div>

            <div class="stats-container">
                <div class="stat-card" style="border-left-color: #a0aec0;">
                    <h4>Investimento</h4>
                    <p id="stat-investido">0,00 €</p>
                </div>
                <div class="stat-card" style="border-left-color: var(--success);">
                    <h4>Lucro / Prejuízo</h4>
                    <p id="stat-lucro">0,00 €</p>
                </div>
                <div class="stat-card" style="border-left-color: #f59e0b;">
                    <h4>Ativas</h4>
                    <p id="stat-pendentes">0 Ativas</p>
                </div>
            </div>

            <div class="layout-grid">
                <!-- FORMULÁRIO ATUALIZADO PARA SIMPLES / MÚLTIPLAS -->
                <div class="form-section">
                    <h3 style="margin-top: 0; color: var(--dark);">📝 Registar Operação</h3>
                    <form id="bet-form" onsubmit="adicionarAposta(event)">
                        <label>Casa de Apostas</label>
                        <select id="form-casa">
                            <option value="Betclic">Betclic</option>
                            <option value="Betano">Betano</option>
                            <option value="Placard">Placard</option>
                        </select>

                        <label>Tipo de Aposta</label>
                        <select id="form-tipo" onchange="alternarTipoAposta(this.value)">
                            <option value="simples">Simples (1 Jogo)</option>
                            <option value="multipla">Múltipla (Vários Jogos)</option>
                        </select>

                        <!-- Zona de Jogos Dinâmica -->
                        <div id="jogos-formulario-container">
                            <div class="multi-game-row">
                                <input type="text" class="input-evento" placeholder="Jogo / Mercado" required>
                                <input type="number" class="input-odd" step="0.01" placeholder="Odd" style="width: 80px;" oninput="calcularOddTotalMultipla()" required>
                            </div>
                        </div>

                        <button type="button" id="btn-add-jogo" class="btn-sub" style="display:none;" onclick="adicionarLinhaJogoForm()">+ Adicionar Jogo</button>

                        <label>Investimento (€)</label>
                        <input type="number" id="form-valor" step="0.01" required>

                        <label>Odd Total Calculada</label>
                        <input type="number" id="form-odd-total" step="0.01" readonly style="background:#e2e8f0; font-weight:bold;">

                        <label>Estado</label>
                        <select id="form-estado">
                            <option value="pendente">Pendente</option>
                            <option value="ganha">Ganha</option>
                            <option value="perdida">Perdida</option>
                        </select>
                        <button type="submit">Adicionar Operação</button>
                    </form>
                </div>

                <div>
                    <h3 style="margin-top: 0; color: var(--dark);">📋 Histórico</h3>
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>Banca / Tipo</th>
                                    <th>Eventos / Jogos Incluídos</th>
                                    <th>Valor</th>
                                    <th>Odd Total</th>
                                    <th>Retorno</th>
                                    <th>Estado</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="table-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- SEPARADOR 2: JOGOS DA SEMANA -->
        <div id="view-jogos" style="display: none;">
            <div class="game-filters">
                <button class="btn-filter active" id="gfilter-hoje" onclick="filtrarJogos('hoje')">Hoje</button>
                <button class="btn-filter" id="gfilter-amanha" onclick="filtrarJogos('amanha')">Amanhã</button>
                <button class="btn-filter" id="gfilter-fds" onclick="filtrarJogos('fds')">Fim de Semana</button>
                <button class="btn-filter" id="gfilter-top6" onclick="filtrarJogos('top6')" style="border: 1px solid #f59e0b;">⭐ Top 6 (Sexta-Dom)</button>
            </div>
            <div class="games-grid" id="games-container"></div>
        </div>
    </div>
    <!-- Tag de versão para limpar a cache do browser -->
    <script src="app.js?v=2"></script>
</body>
</html>
